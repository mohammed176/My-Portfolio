* {
  box-sizing: content-box;
  scroll-behavior: smooth;
  text-transform: capitalize;
  text-decoration: none;
  font-family: "Bebas Neue", sans-serif;
  font-weight: 400;
  font-style: normal;
  font-family: "Readex Pro", sans-serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-style: normal;
  font-variation-settings: "HEXP" 0;
  white-space: nowrap;
}

body {
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: max-content;
  background: linear-gradient(#000033, #00004d, #00004d);
}

#sectRow {
  display: flex;
  flex-direction: row;    
  justify-content: space-evenly; 
  align-items: flex-start;    
  flex-wrap: wrap;
  padding: 10px;
  gap: 20px;
}


.sectcard {
  width: 270px;
  height: 304px;
  background: #07182E;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 20px;
  place-content: center;
  place-items: center;
  overflow: hidden;
  border-radius: 20px;
  margin: 15px;
  transition: 1s;
  margin: 60px;
}

.sectcard:hover{
  scale: 1.1;
}

.sectcard p  {
  z-index: 1;
  color: white;
  font-size: 1.5em;
  text-align: center;
  white-space: wrap;
}
.sectcard span,
.sectcard i {
  z-index: 1;
  color: white;
  font-size: 2.5em;
}

.sectcard::before {
  content: '';
  position: absolute;
  width: 100px;
  background-image: linear-gradient(180deg, rgb(0,183,255), rgb(255,48,255));
  height: 130%;
  animation: rotBGimg 3s linear infinite;
  transition: all 0.2s linear;
}

@keyframes rotBGimg {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.sectcard::after {
  content: '';
  position: absolute;
  background: #07182E;
  inset: 5px;
  border-radius: 15px;
}

.middle{
  display: flex;
  flex-wrap: wrap;
  justify-content: space-evenly;
  gap: 130px;
}

.middle span{  
  z-index: 1;
  color: white;
  font-size: 1.5em;
  text-align: center;
  white-space: wrap;
}

.cardFooter{
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: space-evenly;
  gap: 20px;
}

.cardFooter a{
  font-size: 2px;
  background-color: #ffffff;
  z-index: 1;
  color: rgb(0, 0, 0);
  font-size: 1.5em;
  text-align: center;
  white-space: wrap;
  text-decoration: none;
  width: 100px;
  border-radius: 100px;
  transition: 1s;
  margin: 10px;
}


.cardFooter a:hover{
  scale: 1.2;
}

main {

/* Best-practice, clean, non-conflicting media queries for your design */

/* Tablet & iPad (width: 1024px) */
@media only screen and (min-width: 992px) and (max-width: 1099px) {
  .hs {
    padding-bottom: 1px;
  }
  .hs h2 {
    font-size: 50px;
  }
  .hs h1 {
    font-size: 60px;
  }
  .hs span {
    font-size: 50px;
  }
  .buttons {
    gap: 90px;
    flex-direction: row;
    margin-top: 10px;
  }
  .button {
    transform: scale(1.0);
  }
  .button:hover {
    transform: scale(1.15);
  }
  .sect-header{
    font-size: 23px;
  }
}

/* Medium tablets (width: 820px) */
@media only screen and (min-width: 800px) and (max-width: 899px) {
  .hs {
    padding-bottom: 1px;
  }
  .hs h2 {
    font-size: 35px;
  }
  .hs h1 {
    font-size: 43px;
  }
  .hs span {
    font-size: 35px;
  }
  .buttons {
    gap: 40px;
    flex-direction: row;
    margin-top: 10px;
    width: auto;
  }
  .button {
    margin-top: 40px;
    padding: 10px;
    border-radius: 100px;
    background-color: var(--textColor);
    overflow: hidden;
    transition: transform 0.4s;
    transform: scale(1);
  }
  .button:hover {
    transform: scale(1.15);
  }
  .sect-header{
    font-size: 27px;
  }
}

/* Large screens (up to 1200px) */
@media only screen and (max-width: 1200px) {
  .hs {
    padding-bottom: 1px;

    font-size: 45px;

  .hs h1 {
    font-size: 63px;
  }
  .hs span {
    font-size: 45px;
  }
  .buttons {

    margin-top: 10px;
  }
  .button:hover {
    transform: scale(1.15);
  }
}

/* Tablet and small laptop (up to 700px) */
@media only screen and (max-width: 700px) {
  .hs {
    padding-bottom: 1px;
  }
  .hs h2 {
    font-size: 35px;
  }
  .hs h1 {
    font-size: 43px;
  }
  .hs span {
    font-size: 35px;
  }
  .button:hover {
    transform: scale(1.15);
  }
}

/* Phones and small devices (up to 550px) */
@media only screen and (max-width: 550px) {
  .hs {
    padding-bottom: 1px;
  }
  .hs h2 {
    font-size: 28px;
  }
  .hs h1 {
    font-size: 34px;
  }
  .hs span {
    font-size: 28px;
  }
  .buttons {
    gap: 12px;
    margin-top: 10px;
    transition: 1s;
  }
  .button:hover {
    transform: scale(1.1);
  }
}

/* Very small screens (up to 430px) */
@media only screen and (max-width: 430px) {
  .hs h2 {
    font-size: 1.3em;

  .hs h1 {
    font-size: 1.7em;

    font-size: 1.3em;
  }
